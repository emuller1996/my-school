version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: nest-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: nestdb
      MYSQL_USER: nestuser
      MYSQL_PASSWORD: nestpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:                 # <-- AGREGAR
      - app-network           # <-- AGREGAR

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: nest-phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:                 # <-- AGREGAR
      - app-network           # <-- AGREGAR

volumes:
  mysql_data:

networks:                     # <-- AGREGAR TODO ESTE BLOQUE
  app-network:
    driver: bridge